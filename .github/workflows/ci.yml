name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    # 24.04, not latest: setup-python cannot find a 3.9 build for Ubuntu 26.04
    # ("The version '3.9' with architecture 'x64' was not found"), so the job
    # failed before running anything. 24.04 still ships 3.9 and 3.13.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest supported version, 3.13 the newest tested.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install tools
        run: python -m pip install --upgrade pip ruff pytest
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q core scripts
      - name: Test
        run: python -m pytest

  hygiene:
    name: Personal data and symlinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # LEAK_EXTRA_PATTERNS and LEAK_ALLOW_FILES are optional repository secrets
      # holding project-private terms, so those terms never appear in the repo.
      # Pull requests from forks do not receive secrets; the built-in rules
      # (home paths, emails, tokens, symlinks) still run for them.
      - name: Leak check
        env:
          LEAK_EXTRA_PATTERNS: ${{ secrets.LEAK_EXTRA_PATTERNS }}
          LEAK_ALLOW_FILES: ${{ secrets.LEAK_ALLOW_FILES }}
        run: python scripts/leak_check.py

  plugin:
    name: Plugin manifest and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The validator lives in the CLI and needs no login or API key; a warning
      # (such as the missing listing icon) is not a failure.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin manifest
        run: claude plugin validate .
      - name: Validate the skills
        run: claude plugin validate skills

  installer:
    name: Installer (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: npm test
        working-directory: cli
      - name: Check the package contents
        run: npm pack --dry-run
        working-directory: cli
