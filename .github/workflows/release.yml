name: Release

# Runs when a version tag is pushed (git tag vX.Y.Z && git push origin vX.Y.Z).
# 1. verify:  the tag, plugin.json, cli/package.json and CHANGELOG.md agree, and tests pass
# 2. release: create the GitHub release, with notes taken from CHANGELOG.md
# 3. publish: npm publish, but only after a maintainer approves the `npm-publish`
#             environment (see docs/MAINTAINING.md for the one-time setup)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Tag, versions and changelog agree
        run: python scripts/release_tools.py check "$GITHUB_REF_NAME"
      - name: Tests
        run: |
          python -m pip install --upgrade pip ruff pytest
          ruff check .
          python -m pytest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Installer tests
        run: npm test
        working-directory: cli

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; leaving it alone."
            exit 0
          fi
          python scripts/release_tools.py notes "${TAG#v}" > notes.md
          flags=""
          # Only a semver pre-release tag (for example v0.2.0-rc.1) is marked as one.
          case "$TAG" in *-*) flags="--prerelease";; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $flags

  smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Wait for the registry to serve the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for _ in $(seq 1 60); do
            if npm view "better-oss-cli@$version" version >/dev/null 2>&1; then
              echo "registry serves better-oss-cli@$version"
              exit 0
            fi
            sleep 10
          done
          echo "better-oss-cli@$version was not served by the registry after 10 minutes" >&2
          exit 1
      - name: Run the published package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          got="$(npx --yes "better-oss-cli@$version" --version)"
          if [ "$got" != "$version" ]; then
            echo "published package reports '$got', tag is '$version'" >&2
            exit 1
          fi
      - name: init copies the example files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          home="$(mktemp -d)"
          npx --yes "better-oss-cli@$version" init --no-plugin --home "$home"
          for file in fit-profile.md search-strategy.md voice-guide.md playbook.md; do
            if [ ! -f "$home/$file" ]; then
              echo "init did not create $file" >&2
              exit 1
            fi
          done
      - name: Install the plugin from the marketplace
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm install -g @anthropic-ai/claude-code
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          claude plugin install better-oss --marketplace mobeloper/better-oss
          claude plugin list | grep -q "better-oss"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # A maintainer must approve this environment before the job runs.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish the installer
        run: npm publish --access public --provenance
        working-directory: cli
